<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Energy System History</title><script src="/chart.min.js"></script><style>*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#f8fafc;margin:0;padding:24px}.container{max-width:1200px;margin:0 auto}h1{font-size:1.5rem;margin-bottom:16px;color:#38bdf8}.daybtns{display:flex;gap:8px;margin-bottom:16px}.daybtn{padding:8px 18px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:.9rem;font-family:inherit}.daybtn.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8;font-weight:600}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}.stat{background:#1e293b;border-radius:12px;padding:14px;border:1px solid #334155;text-align:center}.stat .val{font-size:1.35rem;font-weight:700}.stat .lbl{font-size:.78rem;color:#94a3b8;margin-top:4px}.card{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:24px;border:1px solid #334155}.chart-box{position:relative;height:380px;width:100%}.chart-box-sm{position:relative;height:220px;width:100%}#status{color:#94a3b8;font-size:.9rem;margin-bottom:12px}</style></head><body><div class="container"><h1>Solar & Battery System History</h1><div class="daybtns"><button type="button" class="daybtn" id="btnToday">Today</button><button type="button" class="daybtn" id="btnYesterday">Yesterday</button></div><div id="status">Loading...</div><div class="stats"><div class="stat"><div class="val" id="statSolar">--</div><div class="lbl">Solar Generated (kWh)</div></div><div class="stat"><div class="val" id="statImport">--</div><div class="lbl">Grid Import (kWh)</div></div><div class="stat"><div class="val" id="statExport">--</div><div class="lbl">Grid Export (kWh)</div></div><div class="stat"><div class="val" id="statBattery">--</div><div class="lbl">Battery Usage (kWh)</div></div></div><div class="card"><div class="chart-box"><canvas id="powerChart"></canvas></div></div><div class="card"><div class="chart-box-sm"><canvas id="socChart"></canvas></div></div></div><script>var intervalS=300,allRecords=[],powerChart,socChart;var commonScales={x:{grid:{color:'#334155'},ticks:{color:'#94a3b8',maxTicksLimit:12}},y:{grid:{color:'#334155'},ticks:{color:'#94a3b8'}}};function dayBounds(offsetDays){var start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-offsetDays);var end=new Date(start.getTime()+86400000);return[start.getTime(),end.getTime()];}function fmtKwh(v){return v.toFixed(v<10?2:1);}function renderDay(offsetDays){document.getElementById('btnToday').className='daybtn'+(offsetDays===0?' active':'');document.getElementById('btnYesterday').className='daybtn'+(offsetDays===1?' active':'');var bounds=dayBounds(offsetDays),start=bounds[0],end=bounds[1];var records=allRecords.filter(function(d){var ms=d.t*1000;return ms>=start&&ms<end;});var status=document.getElementById('status');if(!records.length){status.textContent=(offsetDays===0?'Today':'Yesterday')+': no history recorded yet for this day.';}else{status.textContent='';}var labels=records.map(function(d){return new Date(d.t*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});});var pv=records.map(function(d){return d.pv_kw;});var load=records.map(function(d){return d.load_kw;});var batt=records.map(function(d){return d.battery_kw;});var grid=records.map(function(d){return d.grid_kw;});var soc=records.map(function(d){return d.soc_pct;});var dtH=intervalS/3600,solarKwh=0,importKwh=0,exportKwh=0,battKwh=0;records.forEach(function(d){solarKwh+=d.pv_kw*dtH;if(d.grid_kw>0)importKwh+=d.grid_kw*dtH;else exportKwh+=-d.grid_kw*dtH;if(d.battery_kw<0)battKwh+=-d.battery_kw*dtH;});document.getElementById('statSolar').textContent=fmtKwh(solarKwh);document.getElementById('statImport').textContent=fmtKwh(importKwh);document.getElementById('statExport').textContent=fmtKwh(exportKwh);document.getElementById('statBattery').textContent=fmtKwh(battKwh);powerChart.data.labels=labels;powerChart.data.datasets[0].data=pv;powerChart.data.datasets[1].data=load;powerChart.data.datasets[2].data=batt;powerChart.data.datasets[3].data=grid;powerChart.update();socChart.data.labels=labels;socChart.data.datasets[0].data=soc;socChart.update();}fetch('/api/history').then(function(r){return r.json();}).then(function(payload){allRecords=payload.records||[];intervalS=payload.interval_s||300;if(!allRecords.length){document.getElementById('status').textContent='No history recorded yet.';}powerChart=new Chart(document.getElementById('powerChart'),{type:'line',data:{labels:[],datasets:[{label:'Solar PV (kW)',data:[],borderColor:'rgba(245,158,11,.85)',backgroundColor:'rgba(245,158,11,.15)',fill:true,tension:.3,pointRadius:1.5},{label:'House Load (kW)',data:[],borderColor:'rgba(59,130,246,.85)',tension:.3,pointRadius:1.5},{label:'Battery Power (kW)',data:[],borderColor:'rgba(16,185,129,.85)',tension:.3,pointRadius:1.5},{label:'Grid Power (kW)',data:[],borderColor:'rgba(239,68,68,.85)',tension:.3,pointRadius:1.5}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{title:{display:true,text:'Power Flow (kW)',color:'#f8fafc'},legend:{labels:{color:'#cbd5e1'}}},scales:commonScales}});socChart=new Chart(document.getElementById('socChart'),{type:'line',data:{labels:[],datasets:[{label:'Battery SOC (%)',data:[],borderColor:'rgba(139,92,246,.85)',backgroundColor:'rgba(139,92,246,.2)',fill:true,tension:.3,pointRadius:1.5}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{title:{display:true,text:'Battery State of Charge (%)',color:'#f8fafc'},legend:{labels:{color:'#cbd5e1'}}},scales:{x:commonScales.x,y:{min:0,max:100,grid:{color:'#334155'},ticks:{color:'#94a3b8'}}}}});document.getElementById('btnToday').onclick=function(){renderDay(0);};document.getElementById('btnYesterday').onclick=function(){renderDay(1);};renderDay(0);}).catch(function(err){document.getElementById('status').textContent='Failed to load history: '+err.message;});</script></body></html>
