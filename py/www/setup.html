<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WiFi Setup</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101418;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#e2e8f0}.card{width:100%;max-width:380px;margin:24px;padding:28px;background:#1e293b;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}h1{font-size:1.3rem;margin:0 0 20px}label{display:block;font-size:.85rem;color:#94a3b8;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;font-size:1rem;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0}input:focus{outline:none;border-color:#38bdf8}button{width:100%;margin-top:24px;padding:14px;font-size:1rem;font-weight:600;border:none;border-radius:8px;background:#38bdf8;color:#0f172a;cursor:pointer}button:active{background:#0ea5e9}#rescan{margin-top:8px;background:transparent;color:#94a3b8;font-weight:400;font-size:.85rem;padding:8px}#networks{max-height:220px;overflow-y:auto;border-radius:8px;border:1px solid #334155;margin-top:6px}.net-item{display:flex;justify-content:space-between;align-items:center;padding:12px;cursor:pointer;border-bottom:1px solid #334155}.net-item:last-child{border-bottom:none}.net-item:active,.net-item.selected{background:#334155}.net-item .rssi{color:#94a3b8;font-size:.85rem;margin-left:8px;white-space:nowrap}#scan-status{font-size:.85rem;color:#94a3b8;margin-top:16px}</style></head><body><div class="card"><h1>Connect this device to WiFi</h1><label>Available networks</label><div id="networks"></div><div id="scan-status">Scanning&hellip;</div><button type="button" id="rescan">Scan again</button><form method="POST" action="/save"><label>Network name (SSID)</label><input id="ssid" name="ssid" required maxlength="32" autocapitalize="off" autocorrect="off" autocomplete="off"><label>Password (leave blank for open networks)</label><input type="password" id="password" name="password" maxlength="64" autocapitalize="off" autocorrect="off" autocomplete="off"><button type="submit">Save &amp; Connect</button></form></div><script>function rssiBars(r){if(r>=-55)return'\u2588\u2588\u2588\u2588';if(r>=-65)return'\u2588\u2588\u2588\u2591';if(r>=-75)return'\u2588\u2588\u2591\u2591';return'\u2588\u2591\u2591\u2591';}function loadNetworks(){var list=document.getElementById('networks');var status=document.getElementById('scan-status');status.textContent='Scanning\u2026';list.innerHTML='';fetch('/scan').then(function(r){return r.json();}).then(function(nets){if(nets.length===0){status.textContent='No networks found.';return;}status.textContent='';nets.forEach(function(n){var item=document.createElement('div');item.className='net-item';var name=document.createElement('span');name.textContent=n.ssid+(n.secure?' \uD83D\uDD12':'');var rssi=document.createElement('span');rssi.className='rssi';rssi.textContent=rssiBars(n.rssi);item.appendChild(name);item.appendChild(rssi);item.onclick=function(){document.getElementById('ssid').value=n.ssid;document.getElementById('password').focus();var sel=list.querySelectorAll('.net-item');for(var i=0;i<sel.length;i++)sel[i].classList.remove('selected');item.classList.add('selected');};list.appendChild(item);});}).catch(function(){status.textContent='Scan failed. Tap "Scan again" to retry.';});}document.getElementById('rescan').onclick=loadNetworks;loadNetworks();</script></body></html>
